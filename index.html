<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Калькулятор">
    <title>Калькулятор остатков</title>
    <meta name="theme-color" content="#7cb9e0">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Калькулятор остатков","short_name":"Калькулятор","start_url":".","display":"standalone","background_color":"#7cb9e0","theme_color":"#7cb9e0","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3476/3476497.png","sizes":"512x512","type":"image/png"}]}'>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3476/3476497.png">

    <style>
        :root {
            --bg-color: #7cb9e0;
            --card-bg: rgba(255, 255, 255, 0.55);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html { height: 100%; -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #7cb9e0;
            background-image:
                linear-gradient(180deg,
                    #7cb9e0 0%,
                    #7cb9e0 14%,
                    #74b0d8 36%,
                    #5d9fcb 60%,
                    #4a8fbe 78%,
                    #5fa3cf 88%,
                    #8cc6e8 100%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(180deg,
                    rgba(124, 185, 224, 0.9) 0%,
                    rgba(124, 185, 224, 0.35) 16%,
                    rgba(124, 185, 224, 0) 32%),
                radial-gradient(ellipse 120% 40% at 50% 108%,
                    rgba(186, 230, 253, 0.55) 0%,
                    rgba(186, 230, 253, 0.18) 45%,
                    transparent 70%),
                radial-gradient(circle at 80% 92%, rgba(2, 132, 199, 0.25) 0%, transparent 55%);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 460px; height: 460px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.45), transparent 70%);
            filter: blur(80px);
            -webkit-filter: blur(80px);
            bottom: -160px; left: 50%;
            transform: translateX(-50%);
            opacity: 0.7;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            animation: bottomGlow 16s ease-in-out infinite;
        }
        @keyframes bottomGlow {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
            50%      { transform: translateX(-50%) translateY(-24px) scale(1.08); }
        }

        .full-width-header {
            width: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .header-logo {
            width: 100%;
            height: auto;
            max-height: 35vh;
            object-fit: cover;
            animation: logoFloat 6s ease-in-out infinite;
            transform-origin: center bottom;
            will-change: transform;
            display: block;
            -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            40%      { transform: translateY(-6px) rotate(-0.6deg) scale(1.015); }
            70%      { transform: translateY(-3px) rotate(0.6deg) scale(1.01); }
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 20px 15px 100px 15px;
            position: relative;
            z-index: 1;
        }

        .calculator-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow:
                0 10px 40px rgba(2, 132, 199, 0.18),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            height: fit-content;
            animation: slideUpFade 0.5s ease-out;
        }

        h2 {
            margin-bottom: 20px;
            color: #0077c8;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 700;
        }

        .form-group { margin-bottom: 18px; position: relative; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: #1e293b;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.6);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.15);
        }

        /* ===== Компактный триггер выбора материала ===== */
        .select-trigger {
            width: 100%;
            padding: 12px 40px 12px 14px;
            background-color: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.6);
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.2;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-family: inherit;
            transition: all 0.25s ease;
            position: relative;
        }

        .select-trigger:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.15);
            outline: none;
        }

        .select-trigger .trigger-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .select-trigger .trigger-text.placeholder {
            color: #94a3b8;
        }

        .select-trigger::after {
            content: '';
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            transform: rotate(45deg) translateY(-2px);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .select-trigger.open::after {
            transform: rotate(-135deg) translateY(-2px);
        }

        /* Скрытый нативный select */
        #materialSelect {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
        }

        /* ===== Bottom-sheet выбора материала ===== */
        .material-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .material-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .material-sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            max-height: 80dvh;
            background: linear-gradient(165deg,
                #eaf6ff 0%,
                #d6ecfb 18%,
                #bfe0f7 40%,
                #a8d3f2 65%,
                #93c6ec 85%,
                #7cb9e0 100%);
            border-radius: 24px 24px 0 0;
            z-index: 201;
            transform: translate(-50%, 110%);
            -webkit-transform: translate(-50%, 110%);
            transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
            display: flex;
            flex-direction: column;
            box-shadow:
                0 -10px 40px rgba(2, 132, 199, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            will-change: transform;
            border-top: 1px solid rgba(255, 255, 255, 0.85);
        }

        .material-sheet::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px 24px 0 0;
            background:
                radial-gradient(ellipse 90% 40% at 50% 0%,
                    rgba(255, 255, 255, 0.75) 0%,
                    transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .material-sheet.active {
            transform: translate(-50%, 0);
            -webkit-transform: translate(-50%, 0);
        }

        .material-sheet.dragging {
            transition: none !important;
        }

        .material-sheet-header {
            padding: 16px 20px 10px 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .material-drag-handle {
            width: 40px;
            height: 5px;
            background-color: rgba(2, 132, 199, 0.35);
            border-radius: 5px;
            margin: 0 auto 12px auto;
            cursor: grab;
            touch-action: none;
        }

        .material-sheet-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0369a1;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .material-sheet-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 16px 20px 16px;
            flex: 1;
            overscroll-behavior: contain;
            position: relative;
            z-index: 1;
        }

        .material-group { margin-bottom: 12px; }

        .material-group-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #0369a1;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 6px 4px 8px 4px;
            opacity: 0.85;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .material-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .material-option {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-family: inherit;
            line-height: 1.25;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .material-option:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.95);
        }

        .material-option .opt-name { font-weight: 600; }

        .material-option .opt-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .material-option.selected {
            border-color: var(--primary);
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
            box-shadow: 0 0 0 1.5px var(--primary), 0 4px 10px rgba(2, 132, 199, 0.2);
        }

        .material-option.custom {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
            border-color: rgba(234, 88, 12, 0.35);
            text-align: center;
            align-items: center;
        }
        .material-option.custom .opt-name { color: #c2410c; }

        .material-option.simple-calc {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            border-color: rgba(2, 132, 199, 0.3);
            text-align: center;
            align-items: center;
        }
        .material-option.simple-calc .opt-name { color: #0369a1; font-weight: 700; }

        .clear-btn {
            position: absolute;
            right: 15px;
            top: 42px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #94a3b8;
            cursor: pointer;
            display: none;
            padding: 5px;
            transition: color 0.2s;
            touch-action: manipulation;
        }
        .clear-btn:hover { color: #ef4444; }

        .info-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
        }

        .tara-info {
            color: #b45309;
            font-weight: 600;
            display: none;
        }

        .custom-fields { animation: slideUpFade 0.3s ease-out; }
        .custom-fields input { padding-right: 44px; }

        .custom-fields input.invalid,
        #totalWeight.invalid {
            border-color: #ef4444 !important;
            background-color: rgba(254, 226, 226, 0.6) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15) !important;
        }

        button.main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(180deg, #2196f3 0%, #0d80d0 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(13, 128, 208, 0.3);
            font-family: inherit;
            touch-action: manipulation;
        }

        button.main-btn.ready { animation: readyPulse 1.8s ease-in-out infinite; }
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 6px 20px rgba(13,128,208,0.3), 0 0 0 0 rgba(13,128,208,0.5); }
            50%      { box-shadow: 0 6px 20px rgba(13,128,208,0.3), 0 0 0 12px rgba(13,128,208,0); }
        }

        button.main-btn:active { transform: scale(0.97); }
        button { position: relative; overflow: hidden; touch-action: manipulation; }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        .action-btn .ripple { background: rgba(2, 132, 199, 0.25); }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        .error {
            color: #dc2626;
            font-size: 0.95rem;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: 600;
            animation: shake 0.4s;
        }

        /* ===== Bottom sheet результата ===== */
        .result-drop-wrap {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 100%;
            max-width: 520px;
            z-index: 100;
            transform: translate(-50%, 110%);
            -webkit-transform: translate(-50%, 110%);
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            padding-top: 40px;
            transition:
                transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.4s ease;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .result-drop-wrap.active {
            transform: translate(-50%, 0);
            -webkit-transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }
        .result-drop-wrap.dragging { transition: none !important; }

        .result-drop-wrap.closing-down {
            transform: translate(-50%, 110%);
            -webkit-transform: translate(-50%, 110%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.55, 0.05, 0.85, 0.4), opacity 0.4s ease;
        }
        .result-drop-wrap.closing-left {
            transform: translate(-150%, 0) rotate(-8deg);
            -webkit-transform: translate(-150%, 0) rotate(-8deg);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.55, 0.05, 0.85, 0.4), opacity 0.4s ease;
        }
        .result-drop-wrap.closing-right {
            transform: translate(50%, 0) rotate(8deg);
            -webkit-transform: translate(50%, 0) rotate(8deg);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.55, 0.05, 0.85, 0.4), opacity 0.4s ease;
        }

        .result-sheet {
            position: relative;
            background: linear-gradient(180deg, #e0f2fe 0%, #ffffff 35%, #ffffff 100%);
            padding: 56px 26px 26px 26px;
            text-align: center;
            border-radius: 50% 50% 50% 50% / 12% 12% 50% 50%;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 20px 60px rgba(2, 132, 199, 0.35), 0 0 0 1px rgba(255,255,255,0.6) inset, 0 -2px 20px rgba(125, 211, 252, 0.4);
            overflow: visible;
        }

        .result-sheet::before {
            content: '';
            position: absolute;
            top: 18px; left: 22%;
            width: 90px; height: 60px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 40%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-25deg);
            pointer-events: none;
            filter: blur(2px); -webkit-filter: blur(2px);
            z-index: 1;
        }

        .result-sheet::after {
            content: '';
            position: absolute;
            top: 55px; left: 18%;
            width: 30px; height: 18px;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            transform: rotate(-30deg);
            pointer-events: none;
            filter: blur(1px); -webkit-filter: blur(1px);
            z-index: 1;
        }

        .result-sheet .drop-tail {
            position: absolute;
            top: -28px; left: 50%;
            transform: translateX(-50%); -webkit-transform: translateX(-50%);
            width: 50px; height: 60px;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 70%, transparent 100%);
            border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
            pointer-events: none;
            filter: blur(1px); -webkit-filter: blur(1px);
            z-index: 0;
        }

        .result-drop-wrap.active .result-sheet { animation: dropBreath 3s ease-in-out 0.8s infinite; }
        @keyframes dropBreath {
            0%, 100% { box-shadow: 0 20px 60px rgba(2, 132, 199, 0.35), 0 0 0 1px rgba(255,255,255,0.6) inset, 0 -2px 20px rgba(125, 211, 252, 0.4); }
            50%      { box-shadow: 0 20px 70px rgba(2, 132, 199, 0.45), 0 0 0 2px rgba(255,255,255,0.8) inset, 0 -4px 30px rgba(125, 211, 252, 0.6); }
        }

        .gas-bubble {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15) 0%, rgba(186, 230, 253, 0.08) 40%, rgba(56, 189, 248, 0.05) 70%, transparent 100%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset -1px -1px 4px rgba(2, 132, 199, 0.15), inset 1px 1px 3px rgba(255, 255, 255, 0.4), 0 0 6px rgba(56, 189, 248, 0.15);
            will-change: transform, opacity;
        }
        .gas-bubble::after {
            content: '';
            position: absolute;
            top: 15%; left: 20%;
            width: 25%; height: 18%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            filter: blur(1px); -webkit-filter: blur(1px);
        }

        .trail-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95) 0%, rgba(186,230,253,0.85) 35%, rgba(125,211,252,0.6) 70%, transparent 100%);
            box-shadow: 0 0 10px rgba(125, 211, 252, 0.7), 0 0 20px rgba(56, 189, 248, 0.4);
            will-change: transform, opacity;
        }

        .splash {
            position: absolute;
            left: 50%; bottom: -10px;
            width: 0; height: 0;
            pointer-events: none;
            z-index: 5;
        }

        .splash-dot {
            position: absolute;
            width: 10px; height: 10px;
            background: radial-gradient(circle, #7dd3fc 0%, #bae6fd 60%, transparent 100%);
            border-radius: 50%;
            left: 0; top: 0;
            opacity: 0;
        }

        .result-drop-wrap.active .splash-dot:nth-child(1) { animation: splashFly1 0.8s ease-out 0.4s forwards; }
        .result-drop-wrap.active .splash-dot:nth-child(2) { animation: splashFly2 0.8s ease-out 0.4s forwards; }
        .result-drop-wrap.active .splash-dot:nth-child(3) { animation: splashFly3 0.8s ease-out 0.4s forwards; }
        .result-drop-wrap.active .splash-dot:nth-child(4) { animation: splashFly4 0.8s ease-out 0.4s forwards; }
        .result-drop-wrap.active .splash-dot:nth-child(5) { animation: splashFly5 0.8s ease-out 0.4s forwards; }
        .result-drop-wrap.active .splash-dot:nth-child(6) { animation: splashFly6 0.8s ease-out 0.4s forwards; }

        @keyframes splashFly1 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(-70px,-40px) scale(0.4);} }
        @keyframes splashFly2 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(70px,-50px) scale(0.4);} }
        @keyframes splashFly3 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(-110px,-20px) scale(0.3);} }
        @keyframes splashFly4 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(110px,-25px) scale(0.3);} }
        @keyframes splashFly5 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(-30px,-80px) scale(0.35);} }
        @keyframes splashFly6 { 0% {opacity:1;transform:translate(0,0) scale(1);} 100% {opacity:0;transform:translate(40px,-75px) scale(0.35);} }

        .sheet-drag-handle {
            width: 40px; height: 5px;
            background-color: rgba(2, 132, 199, 0.25);
            border-radius: 5px;
            margin: 0 auto 6px auto;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative; z-index: 2;
            touch-action: none;
            padding: 10px 0;
            margin-top: -10px; margin-bottom: -4px;
            background-clip: content-box; -webkit-background-clip: content-box;
        }
        .sheet-drag-handle:hover { background-color: rgba(2, 132, 199, 0.5); }

        .result-label {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            position: relative; z-index: 2;
        }

        .result-value {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            margin: 6px 0 20px 0;
            will-change: transform, opacity;
            position: relative; z-index: 2;
            font-variant-numeric: tabular-nums;
            -webkit-font-variant-numeric: tabular-nums;
        }

        @supports (-webkit-background-clip: text) or (background-clip: text) {
            .result-value {
                background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                color: transparent;
            }
        }

        .result-drop-wrap.active .result-value {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            animation-delay: 0.5s;
        }

        @keyframes popIn {
            0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.18) rotate(4deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .result-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            position: relative;
            z-index: 2;
            opacity: 0;
            flex-wrap: wrap;
        }

        .result-drop-wrap.active .result-actions {
            animation: fadeInActions 0.4s ease-out 0.7s forwards;
        }

        @keyframes fadeInActions { to { opacity: 1; } }

        .action-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            touch-action: manipulation;
        }

        .btn-copy { background-color: #e0f2fe; color: var(--primary); }
        .btn-copy:active { transform: scale(0.96); }
        .btn-close { background-color: #f1f5f9; color: #475569; }
        .btn-close:active { transform: scale(0.96); }
        
        .btn-transfer { 
            background-color: #dcfce7; 
            color: #15803d; 
            flex: 1 0 100%;
            margin-bottom: 4px;
        }
        .btn-transfer:active { transform: scale(0.96); }

        .history-toggle {
            margin-top: 25px;
            text-align: center;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: opacity 0.2s;
            padding: 8px;
            touch-action: manipulation;
        }

        .history-toggle:hover { opacity: 0.8; }
        .history-toggle svg { width: 16px; height: 16px; fill: currentColor; }

        .history-list {
            margin-top: 10px;
            display: none;
            background: rgba(248, 250, 252, 0.6);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .history-list.active {
            display: block;
            animation: slideUpFade 0.3s ease-out;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 8px 0;
            border-bottom: 1px dashed #cbd5e1;
            color: #334155;
            gap: 10px;
        }

        .history-item:last-child { border-bottom: none; }

        .history-item span:last-child {
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* ============================================================
           ===== КНОПКА ПЕРЕХОДА В КАЛЬКУЛЯТОР (появляется после переноса)
           ============================================================ */
        .goto-calc-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0369a1;
            border: 1px solid rgba(2, 132, 199, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none; /* Скрыта по умолчанию */
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
            font-family: inherit;
            animation: slideUpFade 0.3s ease-out;
        }
        .goto-calc-btn:active { transform: scale(0.97); background: #bae6fd; }
        .goto-calc-btn.show { display: flex; }

        /* ============================================================
           ===== ОБЫЧНЫЙ КАЛЬКУЛЯТОР =====
           ============================================================ */
        .simple-calc-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: linear-gradient(165deg,
                #eaf6ff 0%,
                #d6ecfb 18%,
                #bfe0f7 40%,
                #a8d3f2 65%,
                #93c6ec 85%,
                #7cb9e0 100%);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            will-change: transform;
        }

        .simple-calc-overlay.active {
            transform: translateY(0);
        }
        
        .simple-calc-overlay.dragging {
            transition: none !important;
        }

        .simple-calc-header {
            padding: 16px 20px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            touch-action: none;
            position: relative;
        }

        .simple-calc-header::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 5px;
            border-radius: 5px;
            background-color: rgba(3, 105, 161, 0.2);
        }

        .simple-calc-back {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #0369a1;
            font-size: 1.2rem;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .simple-calc-back:active { background: rgba(255,255,255,0.8); }

        .simple-calc-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0369a1;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }
        
        .simple-calc-header-spacer {
            width: 40px;
            margin-top: 8px;
        }

        .simple-calc-display {
            padding: 10px 24px 10px 24px;
            text-align: right;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 110px;
        }

        .simple-calc-expr {
            font-size: 1rem;
            color: rgba(3, 105, 161, 0.7);
            min-height: 24px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-variant-numeric: tabular-nums;
        }

        .simple-calc-result {
            font-size: 2.8rem;
            font-weight: 700;
            color: #0284c7;
            line-height: 1.1;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-variant-numeric: tabular-nums;
        }

        .simple-calc-subactions {
            display: flex;
            justify-content: space-between;
            padding: 0 24px 10px 24px;
            gap: 10px;
        }

        .btn-sum-stack {
            flex: 1;
            padding: 10px;
            background: linear-gradient(180deg, #bbf7d0 0%, #86efac 100%);
            color: #15803d;
            border: 1px solid rgba(22, 163, 74, 0.3);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
            transition: all 0.2s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .btn-sum-stack:active { transform: scale(0.97); background: #86efac; }
        
        .btn-calc-copy {
            flex: 0 0 auto;
            width: 44px;
            padding: 0;
            background: rgba(224, 242, 254, 0.9);
            color: #0369a1;
            border: 1px solid rgba(2, 132, 199, 0.2);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-calc-copy:active { transform: scale(0.95); background: #bae6fd; }

        .simple-calc-keys {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 16px;
            padding-bottom: 24px;
        }

        .calc-key {
            border: none;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
            background: rgba(255, 255, 255, 0.65);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.1);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .calc-key:active { transform: scale(0.95); background: #fff; }

        .calc-key.op {
            background: rgba(224, 242, 254, 0.9);
            color: #0369a1;
        }
        .calc-key.op:active { background: #bae6fd; }

        .calc-key.equal {
            background: linear-gradient(180deg, #2196f3 0%, #0d80d0 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(13, 128, 208, 0.4);
        }
        .calc-key.equal:active { background: #0d80d0; }

        .calc-key.fn {
            background: rgba(241, 245, 249, 0.9);
            color: #475569;
            font-size: 1.2rem;
        }
        .calc-key.fn:active { background: #e2e8f0; }

        .calc-key.clear-all {
            background: linear-gradient(180deg, #fecaca 0%, #fca5a5 100%);
            color: #b91c1c;
            font-size: 1.2rem;
        }
        .calc-key.clear-all:active { background: #f87171; }

        @media (max-width: 480px) {
            .simple-calc-result { font-size: 2.4rem; }
            .calc-key { font-size: 1.3rem; border-radius: 14px; }
            .calc-key.fn, .calc-key.clear-all { font-size: 1rem; }
            .simple-calc-keys { gap: 8px; padding: 12px; }
            .simple-calc-subactions { padding: 0 12px 8px 12px; }
            
            .main-wrapper { padding: 15px 10px 100px 10px; }
            .calculator-card { padding: 20px 15px; border-radius: 20px; }
            h2 { font-size: 1.3rem; }
            .result-value { font-size: 3rem; }
            .result-sheet { padding: 50px 20px 22px 20px; }
            .result-sheet::before { left: 15%; width: 70px; height: 48px; }
            .result-drop-wrap { padding-top: 30px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            body::after { display: none; }
        }
    </style>
</head>
<body>

    <header class="full-width-header">
        <img src="https://avatars.mds.yandex.net/i?id=6124276844c9718dbf02bd7e3d195efd_l-12898824-images-thumbs&ref=rim&n=13&w=1280&h=720"
             alt="Логотип"
             class="header-logo"
             onerror="this.style.display='none'">
    </header>

    <main class="main-wrapper">
        <div class="calculator-card">
            <h2>Калькулятор остатков</h2>

            <div class="form-group">
                <label for="selectTrigger">Выберите материал:</label>

                <button type="button"
                        class="select-trigger"
                        id="selectTrigger"
                        onclick="openMaterialSheet()"
                        aria-haspopup="listbox">
                    <span class="trigger-text placeholder" id="triggerText">-- Выберите из списка --</span>
                </button>

                <select id="materialSelect" onchange="updateForm()" tabindex="-1" aria-hidden="true">
                    <option value="" disabled selected>-- Выберите из списка --</option>
                    <option value="1.4|Чай 0,5л|440" data-group="Этикетки">Чай 0,5л</option>
                    <option value="1.92|Чай 1л|530" data-group="Этикетки">Чай 1л</option>
                    <option value="0.29025|0.33л|185" data-group="Этикетки">0.33л</option>
                    <option value="0.3872|0.5л|232" data-group="Этикетки">0.5л</option>
                    <option value="0.54|1.0л|270" data-group="Этикетки">1.0л</option>
                    <option value="0.6806|1.5л|300" data-group="Этикетки">1.5л</option>
                    <option value="1.076|КОСМЕ|70" data-group="Этикетки">КОСМЕ</option>
                    <option value="0.036|ДМ|10.5" data-group="Подложки">ДМ</option>
                    <option value="0.155|ШК|30.7" data-group="Подложки">ШК</option>
                    <option value="__custom__" data-group="Другое">✏️ Свой материал</option>
                    <option value="__simple_calc__" data-group="Другое">🧮 Обычный калькулятор</option>
                </select>
            </div>

            <div class="form-group custom-fields" id="customFields" style="display:none;">
                <label for="itemWeightCustom">Вес одного изделия (в граммах):</label>
                <input type="text"
                       id="itemWeightCustom"
                       placeholder="Например: 0.54"
                       inputmode="decimal"
                       autocomplete="off"
                       oninput="toggleCustomClear('itemWeightCustom','clearItemWeight')">
                <button class="clear-btn" id="clearItemWeight"
                        onclick="clearCustomField('itemWeightCustom','clearItemWeight')"
                        aria-label="Очистить" style="display:none;">✕</button>
                <span class="info-text">Вес одной этикетки / подложки.</span>
            </div>

            <div class="form-group custom-fields" id="taraCustomGroup" style="display:none;">
                <label for="taraWeightCustom">Вес шпули (в граммах):</label>
                <input type="text"
                       id="taraWeightCustom"
                       placeholder="Например: 270"
                       inputmode="decimal"
                       autocomplete="off"
                       oninput="toggleCustomClear('taraWeightCustom','clearTaraWeight')">
                <button class="clear-btn" id="clearTaraWeight"
                        onclick="clearCustomField('taraWeightCustom','clearTaraWeight')"
                        aria-label="Очистить" style="display:none;">✕</button>
                <span class="info-text">Вес пустой шпули (гильзы). Будет вычтен из общего веса.</span>
            </div>

            <div class="form-group" id="totalWeightGroup">
                <label for="totalWeight">Общий вес рулона (в граммах):</label>
                <input type="text"
                       id="totalWeight"
                       placeholder="Например: 1000"
                       inputmode="decimal"
                       autocomplete="off"
                       oninput="toggleClearBtn()">
                <button class="clear-btn" id="clearBtn" onclick="clearInput()" aria-label="Очистить">✕</button>
                <span class="info-text" id="weightHint">Введите вес, который показывают весы.</span>
                <span class="info-text tara-info" id="taraHint"></span>
            </div>

            <button class="main-btn" id="calcBtn" onclick="calculate()">Рассчитать</button>

            <!-- Новая кнопка для быстрого перехода в калькулятор -->
            <button class="goto-calc-btn" id="gotoCalcBtn" onclick="openSimpleCalcFromMain()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line><line x1="4" y1="10" x2="20" y2="10"></line></svg>
                Перейти в калькулятор (<span id="gotoCalcCount">0</span>)
            </button>

            <div class="error" id="errorMsg"></div>

            <div class="history-toggle" onclick="toggleHistory()">
                <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                Последние расчеты
            </div>
            <div class="history-list" id="historyList"></div>

        </div>
    </main>

    <!-- ===== Overlay + Bottom-sheet выбора материала ===== -->
    <div class="material-overlay" id="materialOverlay" onclick="closeMaterialSheet()"></div>

    <div class="material-sheet" id="materialSheet" role="dialog" aria-modal="true" aria-label="Выбор материала">
        <div class="material-sheet-header">
            <div class="material-drag-handle" id="materialDragHandle"></div>
            <div class="material-sheet-title">Выберите материал</div>
        </div>
        <div class="material-sheet-body" id="materialSheetBody">
            <!-- заполняется JS -->
        </div>
    </div>

    <!-- ===== Bottom sheet результата ===== -->
    <div class="result-drop-wrap" id="resultSheet">
        <div class="result-sheet">
            <div class="drop-tail"></div>
            <div class="splash">
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
            </div>
            <div class="sheet-drag-handle" id="dragHandle" aria-label="Закрыть свайпом"></div>
            <div class="result-label">Количество штук:</div>
            <div class="result-value" id="resultValue">0</div>
            <div class="result-actions">
                <button class="action-btn btn-transfer" onclick="transferToCalc()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    В калькулятор
                </button>
                <button class="action-btn btn-copy" id="copyBtn" onclick="copyResult()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Копировать
                </button>
                <button class="action-btn btn-close" onclick="closeResult()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         ОБЫЧНЫЙ КАЛЬКУЛЯТОР
         ============================================================ -->
    <div class="simple-calc-overlay" id="simpleCalcOverlay">
        <div class="simple-calc-header" id="simpleCalcHeader">
            <div class="simple-calc-back" onclick="closeSimpleCalc()">←</div>
            <div class="simple-calc-title">Калькулятор</div>
            <div class="simple-calc-header-spacer"></div>
        </div>
        
        <div class="simple-calc-display">
            <div class="simple-calc-expr" id="simpleCalcExpr"></div>
            <div class="simple-calc-result" id="simpleCalcDisplay">0</div>
        </div>
        
        <div class="simple-calc-subactions">
            <button class="btn-sum-stack" id="btnSumStack" onclick="sumTransferStack()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Сложить всё (<span id="stackCount">0</span>)
            </button>
            
            <div style="flex: 1;"></div>
            
            <button class="btn-calc-copy" id="btnCalcCopy" onclick="copyCalcResult()" title="Копировать результат">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>

        <div class="simple-calc-keys">
            <button class="calc-key clear-all" onclick="simpleCalcAction('clear')">C</button>
            <button class="calc-key fn" onclick="simpleCalcAction('backspace')">⌫</button>
            <button class="calc-key fn" onclick="simpleCalcAction('percent')">%</button>
            <button class="calc-key op" onclick="simpleCalcAction('/')">÷</button>

            <button class="calc-key" onclick="simpleCalcAction('7')">7</button>
            <button class="calc-key" onclick="simpleCalcAction('8')">8</button>
            <button class="calc-key" onclick="simpleCalcAction('9')">9</button>
            <button class="calc-key op" onclick="simpleCalcAction('*')">×</button>

            <button class="calc-key" onclick="simpleCalcAction('4')">4</button>
            <button class="calc-key" onclick="simpleCalcAction('5')">5</button>
            <button class="calc-key" onclick="simpleCalcAction('6')">6</button>
            <button class="calc-key op" onclick="simpleCalcAction('-')">−</button>

            <button class="calc-key" onclick="simpleCalcAction('1')">1</button>
            <button class="calc-key" onclick="simpleCalcAction('2')">2</button>
            <button class="calc-key" onclick="simpleCalcAction('3')">3</button>
            <button class="calc-key op" onclick="simpleCalcAction('+')">+</button>

            <button class="calc-key" onclick="simpleCalcAction('0')" style="grid-column: span 2;">0</button>
            <button class="calc-key" onclick="simpleCalcAction('.')">,</button>
            <button class="calc-key equal" onclick="simpleCalcAction('=')">=</button>
        </div>
    </div>

<script>
    const select = document.getElementById('materialSelect');
    const totalInput = document.getElementById('totalWeight');
    const clearBtn = document.getElementById('clearBtn');
    const resultSheet = document.getElementById('resultSheet');
    const resultValue = document.getElementById('resultValue');

    // ============================================================
    // ===== ЗВУК «ПШИК» =====
    // ============================================================
    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        }
        if (audioCtx.state === 'suspended') { audioCtx.resume().catch(() => {}); }
        return audioCtx;
    }
    function createNoiseBuffer(ctx, duration) {
        const sampleRate = ctx.sampleRate;
        const length = Math.floor(sampleRate * duration);
        const buffer = ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) { data[i] = Math.random() * 2 - 1; }
        return buffer;
    }
    function playFizzSound() {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.gain.value = 0.55;
        masterGain.connect(ctx.destination);

        const noise1 = ctx.createBufferSource();
        noise1.buffer = createNoiseBuffer(ctx, 0.5);
        const bp1 = ctx.createBiquadFilter();
        bp1.type = 'bandpass';
        bp1.frequency.setValueAtTime(1800, now);
        bp1.frequency.exponentialRampToValueAtTime(6500, now + 0.12);
        bp1.frequency.exponentialRampToValueAtTime(2600, now + 0.5);
        bp1.Q.setValueAtTime(0.9, now);
        const hp1 = ctx.createBiquadFilter();
        hp1.type = 'highpass';
        hp1.frequency.setValueAtTime(900, now);
        const g1 = ctx.createGain();
        g1.gain.setValueAtTime(0.0001, now);
        g1.gain.linearRampToValueAtTime(1.0, now + 0.012);
        g1.gain.exponentialRampToValueAtTime(0.35, now + 0.15);
        g1.gain.exponentialRampToValueAtTime(0.08, now + 0.45);
        g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
        noise1.connect(bp1); bp1.connect(hp1); hp1.connect(g1); g1.connect(masterGain);
        noise1.start(now); noise1.stop(now + 0.65);

        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.linearRampToValueAtTime(0.35, now + 0.005);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(g2); g2.connect(masterGain);
        osc.start(now); osc.stop(now + 0.15);

        for (let i = 0; i < 5; i++) {
            const t = now + 0.08 + Math.random() * 0.42;
            const bub = ctx.createOscillator();
            bub.type = 'sine';
            const f = 900 + Math.random() * 1400;
            bub.frequency.setValueAtTime(f, t);
            bub.frequency.exponentialRampToValueAtTime(f * 1.8, t + 0.04);
            const gb = ctx.createGain();
            gb.gain.setValueAtTime(0.0001, t);
            gb.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.04, t + 0.008);
            gb.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
            bub.connect(gb); gb.connect(masterGain);
            bub.start(t); bub.stop(t + 0.09);
        }
    }

    // ============================================================
    // ===== ВВОД И ВАЛИДАЦИЯ =====
    // ============================================================
    function sanitizeNumber(str) {
        let v = str.replace(/,/g, '.').replace(/[^0-9.]/g, '');
        const parts = v.split('.');
        if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
        return v;
    }

    function toggleClearBtn() {
        totalInput.value = sanitizeNumber(totalInput.value);
        clearBtn.style.display = totalInput.value ? 'block' : 'none';
        totalInput.classList.remove('invalid');
        checkReady();
    }

    function clearInput() {
        totalInput.value = '';
        toggleClearBtn();
        totalInput.focus();
    }

    function toggleCustomClear(inputId, btnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        input.value = sanitizeNumber(input.value);
        btn.style.display = input.value ? 'block' : 'none';
        input.classList.remove('invalid');
        checkReady();
    }

    function clearCustomField(inputId, btnId) {
        const input = document.getElementById(inputId);
        input.value = '';
        document.getElementById(btnId).style.display = 'none';
        input.classList.remove('invalid');
        input.focus();
        checkReady();
    }

    function updateForm() {
        errorMsg.style.display = 'none';
        totalInput.value = '';
        toggleClearBtn();

        const val = select.value;
        const isCustom = val === '__custom__';
        const isSimpleCalc = val === '__simple_calc__';

        customFields.style.display = isCustom ? 'block' : 'none';
        taraCustomGroup.style.display = isCustom ? 'block' : 'none';
        totalWeightGroup.style.display = isSimpleCalc ? 'none' : 'block';
        calcBtn.style.display = isSimpleCalc ? 'none' : 'block';

        // Скрываем кнопку перехода, если открыт обычный калькулятор
        if (isSimpleCalc) {
            gotoCalcBtn.style.display = 'none';
        } else {
            updateStackBtn();
        }

        if (isCustom) {
            taraHint.style.display = 'none';
            weightHint.textContent = "Введите общий вес рулона (с учётом шпули).";
            itemWeightCustom.value = '';
            taraWeightCustom.value = '';
            itemWeightCustom.classList.remove('invalid');
            taraWeightCustom.classList.remove('invalid');
            document.getElementById('clearItemWeight').style.display = 'none';
            document.getElementById('clearTaraWeight').style.display = 'none';
        } else if (val && !isSimpleCalc) {
            const [, , taraWeightStr] = val.split('|');
            taraHint.style.display = 'block';
            taraHint.textContent = `Вес шпули (${taraWeightStr} г) будет вычтен автоматически.`;
            weightHint.textContent = "Введите общий вес рулона.";
        } else if (!isSimpleCalc) {
            taraHint.style.display = 'none';
            weightHint.textContent = "Введите вес, который показывают весы.";
        }

        if (isSimpleCalc) {
            openSimpleCalc();
        } else {
            totalInput.focus();
        }
        
        checkReady();
    }

    function checkReady() {
        const val = select.value;
        if (val === '__simple_calc__') return;

        const totalOk = parseFloat(totalInput.value) > 0;

        if (val === '__custom__') {
            const itemOk = parseFloat(itemWeightCustom.value) > 0;
            const taraOk = taraWeightCustom.value.trim() !== '' &&
                           parseFloat(taraWeightCustom.value) >= 0;
            calcBtn.classList.toggle('ready', totalOk && itemOk && taraOk);
            return;
        }

        calcBtn.classList.toggle('ready', !!val && totalOk);
    }

    // ============================================================
    // ===== КАСТОМНЫЙ СПИСОК МАТЕРИАЛОВ =====
    // ============================================================
    function buildMaterialList() {
        const groups = {};
        const opts = select.querySelectorAll('option[value]');
        opts.forEach(opt => {
            if (!opt.value) return;
            const group = opt.dataset.group || 'Другое';
            if (!groups[group]) groups[group] = [];
            groups[group].push({
                value: opt.value,
                label: opt.textContent.trim(),
                isCustom: opt.value === '__custom__',
                isSimpleCalc: opt.value === '__simple_calc__'
            });
        });

        let html = '';
        Object.keys(groups).forEach(groupName => {
            html += `<div class="material-group" data-group-name="${groupName}">`;
            html += `<div class="material-group-title">${groupName}</div>`;
            html += `<div class="material-grid">`;
            groups[groupName].forEach(item => {
                let cls = 'material-option';
                if (item.isCustom) cls += ' custom';
                if (item.isSimpleCalc) cls += ' simple-calc';
                
                let meta = '';
                if (item.isCustom) {
                    meta = `<span class="opt-meta">Задать вес изделия и шпули вручную</span>`;
                } else if (item.isSimpleCalc) {
                    meta = `<span class="opt-meta">Обычные математические операции</span>`;
                } else {
                    const parts = item.value.split('|');
                    if (parts.length >= 3) {
                        meta = `<span class="opt-meta">${parts[0]} г · шпуля ${parts[2]} г</span>`;
                    }
                }
                
                html += `<button type="button" class="${cls}" data-value="${item.value}" onclick="pickMaterial(this)">
                            <span class="opt-name">${item.label}</span>
                            ${meta}
                        </button>`;
            });
            html += `</div></div>`;
        });

        materialSheetBody.innerHTML = html;
        highlightSelected();
    }

    function highlightSelected() {
        const current = select.value;
        materialSheetBody.querySelectorAll('.material-option').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.value === current);
        });
    }

    function openMaterialSheet() {
        highlightSelected();
        materialOverlay.classList.add('active');
        materialSheet.classList.add('active');
        selectTrigger.classList.add('open');

    function closeMaterialSheet() {
        materialOverlay.classList.remove('active');
        materialSheet.classList.remove('active');

        materialSheet.style.transform = '';

    function pickMaterial(btn) {

        triggerText.textContent = label;
        triggerText.classList.remove('placeholder');
